<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Clinic — Card Customizer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand:       #003867;
    --brand-mid:   #00509e;
    --brand-light: #e6f0f8;
    --accent:      #0070c9;
    --bg:          #eef2f7;
    --surface:     #ffffff;
    --border:      #dde3ec;
    --text:        #0f1d2e;
    --muted:       #60748a;
    --radius:      14px;
    --radius-sm:   9px;
    --sidebar-w:   350px;
    --header-h:    58px;
  }

  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: var(--header-h);
    background: var(--brand);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }

  .header-logo {
    height: 32px;
    width: auto;
    object-fit: contain;
  }

  .header-sep {
    width: 1px;
    height: 22px;
    background: rgba(255,255,255,0.25);
  }

  .header-title {
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    opacity: 0.92;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 1fr var(--sidebar-w);
    gap: 20px;
    padding: 20px;
    max-width: 1440px;
    margin: 0 auto;
    align-items: start;
  }

  /* ── Stage ── */
  .stage {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .stage-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  canvas {
    width: 100%;
    height: auto;
    border-radius: var(--radius-sm);
    display: block;
    background: #cfd7e3;
    border: 1px solid var(--border);
  }

  .status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    min-height: 16px;
  }

  /* ── Sidebar ── */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: sticky;
    top: calc(var(--header-h) + 14px);
  }

  /* ── Panel ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .panel-head {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    background: #f7f9fb;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .panel-head svg {
    width: 14px; height: 14px;
    stroke: var(--muted);
    stroke-width: 2;
    fill: none;
    flex-shrink: 0;
  }

  .panel-body { padding: 16px; }

  /* ── Card design picker ── */
  .design-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .design-opt {
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    position: relative;
    background: #eef2f7;
  }

  .design-opt:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,112,201,0.14);
  }

  .design-opt.active {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(0,56,103,0.14);
  }

  .design-opt img {
    width: 100%;
    height: 86px;
    object-fit: cover;
    display: block;
  }

  .design-tag {
    padding: 6px 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    background: #f7f9fb;
    border-top: 1px solid var(--border);
    text-align: center;
    transition: background 0.15s, color 0.15s;
  }

  .design-opt.active .design-tag {
    background: var(--brand-light);
    color: var(--brand);
  }

  .checkmark {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    background: var(--brand);
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }

  .checkmark svg {
    width: 11px; height: 11px;
    stroke: #fff;
    stroke-width: 2.5;
    fill: none;
  }

  .design-opt.active .checkmark { display: flex; }

  /* ── Name input ── */
  .name-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .name-input::placeholder { color: #a0afc0; }

  .name-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,112,201,0.12);
  }

  /* ── Download button ── */
  .btn-dl {
    margin-top: 10px;
    width: 100%;
    padding: 12px 16px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }

  .btn-dl:hover  { background: var(--brand-mid); }
  .btn-dl:active { transform: scale(0.98); }

  .btn-dl svg {
    width: 17px; height: 17px;
    stroke: currentColor;
    stroke-width: 2.2;
    fill: none;
  }

  /* ── Fields ── */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  .field > label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 7px;
  }

  .field > label .val {
    font-size: 11.5px;
    font-weight: 400;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .field select, .field input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .field select:focus { border-color: var(--accent); }

  input[type="range"] {
    width: 100%;
    height: 4px;
    accent-color: var(--brand);
    cursor: pointer;
  }

  /* ── Color row ── */
  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .color-swatch {
    width: 44px;
    height: 36px;
    padding: 2px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: #fff;
  }

  .color-hex {
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.05em;
    font-family: monospace;
  }

  /* ── Mobile ── */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; padding: 12px; }
    .sidebar { position: static; top: auto; }
    .design-grid { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>

<body>

<header>
  <img class="header-logo" src="logo.webp" alt="My Clinic" onerror="this.style.display='none'" />
  <div class="header-sep"></div>
  <span class="header-title">Card Customizer &nbsp;·&nbsp; تخصيص البطاقة</span>
</header>

<div class="layout">

  <!-- ── Canvas ── -->
  <div class="stage">
    <div class="stage-label">Preview</div>
    <canvas id="cardCanvas"></canvas>
    <p id="status" class="status"></p>
  </div>

  <!-- ── Sidebar ── -->
  <div class="sidebar">

    <!-- Card Design Picker -->
    <div class="panel">
      <div class="panel-head">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Card Design | تصميم البطاقة
      </div>
      <div class="panel-body">
        <div class="design-grid">

          <div class="design-opt active" data-card="card.png" onclick="selectCard(this)">
            <img src="card.png" alt="Design 1" />
            <div class="checkmark">
              <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
            </div>
            <div class="design-tag">Design 1</div>
          </div>

          <div class="design-opt" data-card="card2.png" onclick="selectCard(this)">
            <img src="card2.png" alt="Design 2" />
            <div class="checkmark">
              <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
            </div>
            <div class="design-tag">Design 2</div>
          </div>

          <div class="design-opt" data-card="card3.png" onclick="selectCard(this)">
            <img src="card3.png" alt="Design 3" />
            <div class="checkmark">
              <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
            </div>
            <div class="design-tag">Design 3</div>
          </div>

        </div>
      </div>
    </div>

    <!-- Name + Download -->
    <div class="panel">
      <div class="panel-head">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Your Name | اسمك
      </div>
      <div class="panel-body">
        <input id="nameText" type="text" class="name-input"
               placeholder="اكتب اسمك  /  Type your name" />
        <button class="btn-dl" id="downloadBtn">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v13M7 11l5 5 5-5"/>
            <path d="M5 20h14" stroke-linecap="round"/>
          </svg>
          Download | تحميل الصورة
        </button>
      </div>
    </div>

    <!-- Settings -->
    <div class="panel">
      <div class="panel-head">
        <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 5v14M15 5v14M9 12h6"/></svg>
        Settings | الإعدادات
      </div>
      <div class="panel-body">

        <div class="field">
          <label for="fontFamily">Font</label>
          <select id="fontFamily">
            <option value="'IBM Plex Sans','IBM Plex Sans Arabic',Arial,sans-serif" selected>IBM Plex Sans</option>
            <option value="'IBM Plex Sans Arabic','IBM Plex Sans',Arial,sans-serif">IBM Plex Sans Arabic</option>
            <option value="Poppins,Arial,sans-serif">Poppins</option>
            <option value="Georgia,serif">Georgia</option>
            <option value="'Times New Roman',Times,serif">Times New Roman</option>
            <option value="Arial,sans-serif">Arial</option>
            <option value="Impact,'Arial Narrow Bold',sans-serif">Impact</option>
          </select>
        </div>

        <div class="field">
          <label for="fontSize">
            Font Size
            <span class="val"><span id="fontSizeVal">96</span> px</span>
          </label>
          <input id="fontSize" type="range" min="24" max="300" value="96" step="1" />
        </div>

        <div class="field">
          <label for="posSlider">
            Vertical Position
            <span class="val"><span id="posVal">80</span>%</span>
          </label>
          <input id="posSlider" type="range" min="0" max="100" value="80" step="1" />
        </div>

        <div class="field">
          <label for="textColor">Text Color</label>
          <div class="color-row">
            <input id="textColor" type="color" class="color-swatch" value="#ffffff" />
            <span id="colorHex" class="color-hex">#ffffff</span>
          </div>
        </div>

      </div>
    </div>

  </div><!-- /.sidebar -->
</div><!-- /.layout -->

<script>
  const nameInput   = document.getElementById('nameText');
  const fontSel     = document.getElementById('fontFamily');
  const fontSzSldr  = document.getElementById('fontSize');
  const fontSzVal   = document.getElementById('fontSizeVal');
  const posSldr     = document.getElementById('posSlider');
  const posValEl    = document.getElementById('posVal');
  const colorInput  = document.getElementById('textColor');
  const colorHexEl  = document.getElementById('colorHex');
  const canvas      = document.getElementById('cardCanvas');
  const ctx         = canvas.getContext('2d');
  const statusEl    = document.getElementById('status');

  let currentCard = 'card.png';
  let imgCache    = {};

  function loadImg(src) {
    return new Promise((resolve, reject) => {
      if (imgCache[src]) return resolve(imgCache[src]);
      const i = new Image();
      i.onload  = () => { imgCache[src] = i; resolve(i); };
      i.onerror = () => reject(new Error('Could not load: ' + src));
      i.src = src;
    });
  }

  async function draw() {
    let img;
    try {
      img = await loadImg(currentCard);
      statusEl.textContent = '';
    } catch(e) {
      statusEl.textContent = e.message;
      return;
    }

    canvas.width  = img.naturalWidth  || img.width;
    canvas.height = img.naturalHeight || img.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    // Name
    const name = (nameInput.value || '').trim();
    if (!name) return;

    const sizePx  = parseInt(fontSzSldr.value, 10);
    const yPct    = parseInt(posSldr.value, 10) / 100;
    const baseY   = Math.round(canvas.height * yPct);
    const centerX = Math.round(canvas.width  / 2);

    ctx.save();
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = `700 ${sizePx}px ${fontSel.value}`;
    ctx.fillStyle    = colorInput.value || '#ffffff';
    ctx.fillText(name, centerX, baseY);
    ctx.restore();
  }

  function selectCard(el) {
    document.querySelectorAll('.design-opt').forEach(d => d.classList.remove('active'));
    el.classList.add('active');
    currentCard = el.dataset.card;
    delete imgCache[currentCard];
    draw();
  }

  [nameInput, fontSel, fontSzSldr, posSldr, colorInput].forEach(el => {
    el.addEventListener('input', () => {
      if (el === fontSzSldr)  fontSzVal.textContent  = fontSzSldr.value;
      if (el === posSldr)     posValEl.textContent   = posSldr.value;
      if (el === colorInput)  colorHexEl.textContent = colorInput.value;
      draw();
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'my-clinic-card.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  window.addEventListener('load', () => {
    fontSzVal.textContent  = fontSzSldr.value;
    posValEl.textContent   = posSldr.value;
    colorHexEl.textContent = colorInput.value;
    draw();
  });
</script>
</body>
</html>
